plugins {
    id 'java'
    id 'application'
    id 'org.openjfx.javafxplugin' version '0.1.0'
}

group = 'tr.erdvyn'
version = providers.environmentVariable('RELEASE_VERSION').orElse('2.1.18').get()

repositories { mavenCentral() }

dependencies {
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.22.2'
    implementation 'net.raphimc:MinecraftAuth:5.0.2'
    implementation 'net.java.dev.jna:jna-platform:5.19.1'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.13.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test { useJUnitPlatform() }

java {
    toolchain { languageVersion = JavaLanguageVersion.of(21) }
}

application {
    mainClass = 'tr.erdvyn.launcher.ErdvynLauncher'
    applicationDefaultJvmArgs = ['-Dprism.order=d3d,sw']
}

processResources {
    filesMatching('launcher-version.properties') {
        expand launcher_version: project.version
    }
}

tasks.register('verifyManagedPack', JavaExec) {
    group = 'verification'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'tr.erdvyn.launcher.PackVerifierCli'
}

tasks.register('compileMinecraftLaunchProbe', JavaCompile) {
    source = file('tools/MinecraftLaunchProbe.java')
    classpath = sourceSets.main.runtimeClasspath
    destinationDirectory = layout.buildDirectory.dir('probe-classes')
    options.encoding = 'UTF-8'
}

tasks.register('minecraftLaunchProbe', JavaExec) {
    group = 'verification'
    dependsOn classes, compileMinecraftLaunchProbe
    classpath = files(layout.buildDirectory.dir('probe-classes')) + sourceSets.main.runtimeClasspath
    mainClass = 'tr.erdvyn.launcher.MinecraftLaunchProbe'
}

tasks.register('compileMinecraftInstallProbe', JavaCompile) {
    source = file('tools/MinecraftInstallProbe.java')
    classpath = sourceSets.main.runtimeClasspath
    destinationDirectory = layout.buildDirectory.dir('install-probe-classes')
    options.encoding = 'UTF-8'
}

tasks.register('minecraftInstallProbe', JavaExec) {
    group = 'verification'
    dependsOn classes, compileMinecraftInstallProbe
    classpath = files(layout.buildDirectory.dir('install-probe-classes')) + sourceSets.main.runtimeClasspath
    mainClass = 'tr.erdvyn.launcher.MinecraftInstallProbe'
}

tasks.register('compileApiTicketProbe', JavaCompile) {
    source = file('tools/ApiTicketProbe.java')
    classpath = sourceSets.main.runtimeClasspath
    destinationDirectory = layout.buildDirectory.dir('api-probe-classes')
    options.encoding = 'UTF-8'
}

tasks.register('apiTicketProbe', JavaExec) {
    group = 'verification'
    dependsOn classes, compileApiTicketProbe
    classpath = files(layout.buildDirectory.dir('api-probe-classes')) + sourceSets.main.runtimeClasspath
    mainClass = 'tr.erdvyn.launcher.ApiTicketProbe'
    args project.findProperty('manifestSha') ?: '', project.findProperty('ticketOutput') ?: ''
}

javafx {
    version = '21.0.7'
    modules = ['javafx.graphics', 'javafx.media', 'javafx.swing']
}

jar {
    archiveBaseName = 'ErdvynLauncher'
    manifest { attributes 'Main-Class': application.mainClass.get() }
}
