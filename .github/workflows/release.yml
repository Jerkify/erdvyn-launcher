name: release

on:
  push:
    tags:
      - "v*"

# Build with a read-only token; only the publish job may write the release.
permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      # Actions are pinned to commits: a moved tag cannot swap the code that builds the installer.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - name: version
        id: version
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: |
          # The tag is untrusted text: validate it instead of expanding it into the script.
          if ($env:TAG -notmatch '^v\d+\.\d+\.\d+$') { throw "Unexpected release tag: $env:TAG" }
          $version = $env:TAG.Substring(1)
          "RELEASE_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
      - name: install Inno Setup
        shell: pwsh
        run: choco install innosetup --version 6.7.1 --yes --no-progress
      - name: package
        shell: pwsh
        run: .\tools\build-release.ps1 -Version $env:RELEASE_VERSION
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: erdvyn-launcher-${{ env.RELEASE_VERSION }}
          path: |
            build/dist/Erdvyn-Launcher-Setup-${{ env.RELEASE_VERSION }}.exe
            build/dist/Erdvyn-Launcher-Portable-${{ env.RELEASE_VERSION }}.zip
            build/dist/SHA256SUMS.txt
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: erdvyn-launcher-${{ needs.build.outputs.version }}
          path: dist
      # Launchers from 2.1.24 on only install releases whose SHA256SUMS.txt carries this Ed25519 signature.
      # The key is used here, in a job that runs no project code, never in the Gradle build job.
      - name: sign checksums
        env:
          SIGNING_KEY: ${{ secrets.LAUNCHER_SIGNING_KEY }}
        run: |
          if [ -z "$SIGNING_KEY" ]; then
            echo "::warning::LAUNCHER_SIGNING_KEY is not set: this release is unsigned and launchers 2.1.24+ will not offer it"
            exit 0
          fi
          set -o pipefail
          umask 077
          printf '%s\n' "$SIGNING_KEY" > "$RUNNER_TEMP/key.pem"
          openssl pkeyutl -sign -inkey "$RUNNER_TEMP/key.pem" -rawin -in dist/SHA256SUMS.txt | base64 -w0 > dist/SHA256SUMS.txt.sig
          rm -f "$RUNNER_TEMP/key.pem"
      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          files=("dist/Erdvyn-Launcher-Setup-$VERSION.exe" "dist/Erdvyn-Launcher-Portable-$VERSION.zip" "dist/SHA256SUMS.txt")
          if [ -f dist/SHA256SUMS.txt.sig ]; then files+=("dist/SHA256SUMS.txt.sig"); fi
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --generate-notes "${files[@]}"
